<!doctype html><html><head><title>Contact form</title></head><body>
<h1>Contact us</h1>
<form id="f"><input name="name" placeholder="Your name"><input name="email" type="email" placeholder="Email">
<input name="pw" type="password" placeholder="Password"><textarea name="msg" placeholder="Message"></textarea>
<button type="submit">Send</button></form><p id="out"></p>
<script>document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); const d = new FormData(e.target); document.getElementById("out").textContent = "Thanks " + d.get("name") + " (" + d.get("email") + ")"; });</script>
</body></html>
